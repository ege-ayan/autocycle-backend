name: Deploy

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: autocycle-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login

      - name: Build and push
        id: image
        run: |
          IMAGE="${{ steps.login.outputs.registry }}/${ECR_REPOSITORY}:${{ github.event.release.tag_name }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Roll out on EC2
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          INSTANCE=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=autocycle-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          if [ "$INSTANCE" = "None" ] || [ -z "$INSTANCE" ]; then
            echo "No running autocycle-app instance."
            exit 1
          fi
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${{ github.event.release.tag_name }}" \
            --parameters "commands=[\"/opt/autocycle/deploy.sh $IMAGE\"]" \
            --query 'Command.CommandId' \
            --output text)
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)
            echo "$STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
            esac
            sleep 10
          done
          echo "Deploy timed out."
          exit 1
